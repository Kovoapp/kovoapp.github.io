name: Publicar funciones de Supabase

# Publica las funciones de Mercado Pago cuando cambian, o a mano desde la pestaña Actions.
# Necesita el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nhtbjrhdjtlrhxrlezyj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN. Las funciones no se publicaron."
            exit 0
          fi
          # Las dos verifican la sesión por su cuenta (mp-webhook la llama Mercado Pago).
          supabase functions deploy mp-suscribir --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy mp-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
